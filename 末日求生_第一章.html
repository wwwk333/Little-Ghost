<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>末日求生·寂静居民楼</title>
<!--新字体引入 -->
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<style>
  /* ============================================================
   全局CSS变量 - 颜色主题
   ============================================================ */
  :root {
    --bg: #0d0d0d;
    --panel: #141414;
    --border: #2a2a2a;
    --text: #c8c8c8;
    --dim: #666;
    --accent: #8a6a3a;
    --accent2: #5a7a5a;
    --danger: #7a3a3a;
    --highlight: #e8d4a8;
    --white: #e0e0e0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }


  /* ============================================================
   基础布局
  ============================================================ */
body {
  background: #0d0d0d url('https://你的图片地址.jpg') center/cover fixed no-repeat;
  color: var(--text);
  font-family: 'Noto Serif SC', 'SimSun', Georgia, serif;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  padding: 20px;
  transition: background-image 1s ease;
}

/* 全局遮罩，压暗背景图 */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.70);
  z-index: 0;
  pointer-events: none;
}

/* 让 #app 浮在遮罩上方 */
#app {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 720px;
  display: flex;
  flex-direction: column;
  gap: 0;
}


/* ---- 顶部状态栏 ---- */
  #status-bar {
    background: var(--panel);
    border: 1px solid var(--border);
    border-bottom: none;
    padding: 10px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: var(--dim);
    font-family: 'Courier New', monospace;
  }
  #chapter-label { color: var(--accent); font-weight: bold; letter-spacing: 1px; }
  #stats {
    display: flex;
    gap: 16px;
  }
  .stat { display: flex; align-items: center; gap: 4px; }
  .stat-icon { font-size: 11px; }
  .stat-val { color: var(--text); }


/* ---- 叙事文本区 ---- */
  #narrative-box {
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 28px 32px;
    min-height: 280px;
    line-height: 2;
    font-size: 15px;
    color: var(--text);
    position: relative;
    cursor: pointer; 
  }
  #narrative-box p {
    margin-bottom: 14px;
  }
   #narrative-content {
  pointer-events: none;
}
  #narrative-box p:last-child { margin-bottom: 0; }
  .narr-scene { color: var(--dim); font-style: italic; font-size: 13px; }
  .narr-thought { color: var(--highlight); font-style: italic; }
  .narr-dialogue::before { content: '"'; }
  .narr-dialogue::after { content: '"'; }
  .narr-important { color: var(--white); font-weight: bold; }
  .narr-hint { 
    color: var(--accent); 
    font-size: 13px; 
    border-left: 2px solid var(--accent);
    padding-left: 12px;
    margin-top: 8px;
  }

  
/* ---- 结局特殊样式 ---- */
  .ending-good {
    background: linear-gradient(180deg, #0d1a0d 0%, var(--panel) 100%);
    border-color: var(--accent2);
  }
  .ending-bad {
    background: linear-gradient(180deg, #1a0d0d 0%, var(--panel) 100%);
    border-color: var(--danger);
  }
  .ending-title {
    font-size: 20px;
    color: var(--highlight);
    text-align: center;
    margin: 20px 0 8px;
    letter-spacing: 3px;
  }
  .ending-subtitle {
    font-size: 12px;
    color: var(--dim);
    text-align: center;
    font-style: italic;
    margin-bottom: 24px;
  }



 /* ---- 选项区 ---- */
  #choices-box {
    background: var(--panel);
    border: 1px solid var(--border);
    border-top: 1px solid #222;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  #choices-label {
    font-size: 11px;
    color: var(--dim);
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 4px;
    font-family: monospace;
  }
  .choice-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 16px;
    text-align: left;
    cursor: pointer;
    font-family: inherit;
    font-size: 14px;
    line-height: 1.6;
    transition: all 0.15s ease;
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }
  /* 选项按钮悬停时光标闪烁 */
.choice-btn::before {
  content: '▶';
  color: transparent;
  font-size: 10px;
  margin-right: 4px;
  transition: color 0.15s;
}
.choice-btn:hover::before {
  color: var(--accent);
  animation: blink 0.6s infinite;
}
  .choice-btn:hover {
    background: #1f1f1f;
    border-color: var(--accent);
    color: var(--white);
  }
  .choice-btn:active {
    background: #252010;
  }
  .choice-key {
    color: var(--accent);
    font-family: monospace;
    font-size: 13px;
    min-width: 18px;
    margin-top: 1px;
    font-weight: bold;
  }
  .choice-text { flex: 1; }
  .choice-tag {
    font-size: 10px;
    color: var(--dim);
    background: #222;
    padding: 2px 6px;
    border-radius: 2px;
    white-space: nowrap;
    align-self: center;
  }
  .choice-tag.danger { color: #a05050; background: #1a0d0d; border: 1px solid #3a1a1a; }
  .choice-tag.good { color: #508050; background: #0d1a0d; border: 1px solid #1a3a1a; }


 /* ---- 底部信息栏（打字完成后才显示） ---- */
  #footer-bar {
    background: var(--panel);
    border: 1px solid var(--border);
    border-top: none;
    padding: 8px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    color: var(--dim);
    font-family: monospace;
    display: none;
  }


/* ---- 结局重来按钮 ---- */
  #restart-area {
    display: none;
    text-align: center;
    padding: 16px;
    gap: 12px;
    flex-direction: column;
    align-items: center;
  }
  .restart-btn {
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    padding: 10px 24px;
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
    letter-spacing: 1px;
    transition: all 0.15s;
  }
  .restart-btn:hover { background: #1a1205; color: var(--highlight); }


/* ---- 动画定义 ---- */
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
  #cursor { display: inline-block; animation: blink 1s infinite; color: var(--accent); }

  /* 加载动画 */
  #loading {
    display: none;
    text-align: center;
    color: var(--dim);
    font-size: 13px;
    padding: 20px;
  }

  /* 翻页动画 */
  .fade-in {
    animation: fadeIn 0.4s ease;
  }
  @keyframes fadeIn { from{opacity:0; transform:translateY(4px)} to{opacity:1; transform:translateY(0)} }
  @keyframes hintPulse {
  0%, 100% { opacity: 0.55; }
  50%       { opacity: 0.12; }
}
  
/* 移动端适配 */
  @media (max-width: 500px) {
    body { padding: 0; }
    #narrative-box { padding: 20px 18px; }
    #narrative-box { font-size: 14px; }
  }


/* ---- 右下角悬浮控制按钮 ---- */
#game-controls {
  position: fixed;
  bottom: 20px;
  right: 20px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  z-index: 999;
}
.ctrl-btn {
  width: 38px;
  height: 38px;
  background: rgba(20,20,20,0.90);
  border: 1px solid var(--border);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 15px;
  transition: border-color 0.2s, background 0.2s;
  user-select: none;
  color: var(--dim);
}
.ctrl-btn:hover {
  border-color: var(--accent);
  background: rgba(30,24,14,0.95);
}


/* ============================================================
   引导页（最先出现，点击进入标题页）
   ============================================================ */
#intro-screen {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #020202 url('images/title_bg.jpg') center/cover no-repeat;
  z-index: 200;
  cursor: pointer;
}

#intro-overlay {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.80);
}

#intro-content {
  position: relative;
  z-index: 1;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}

#intro-logo {
  font-size: 65px;
  font-family: 'Ma Shan Zheng', 'STXingkai', 'KaiTi', serif;
  font-weight: 900;
  color:  #c3a47f;
  letter-spacing: 14px;
  text-shadow:
    0 0 40px rgba(180,150,100,0.3),
    1px 2px 0px rgba(0,0,0,0.9);
  opacity: 0;
  animation: introLogoIn 2s cubic-bezier(0.16,1,0.3,1) forwards;
  animation-delay: 0.5s;
}

@keyframes introLogoIn {
  0%   { opacity:0; letter-spacing:22px; filter:blur(6px); }
  70%  { opacity:1; filter:blur(0); }
  100% { opacity:1; letter-spacing:14px; }
}

/*副标题 */
#intro-sub {
  font-family: 'Ma Shan Zheng', 'STXingkai', serif;
  font-size: 14px;
  color:#856351;
  letter-spacing: 10px;
  opacity: 0;
  animation: subFadeIn 1s ease forwards;
  animation-delay: 2s;
}

/*引导进入游戏标题 */
#intro-enter {
  font-size: 13px;
  color: #7a5a4a;
  letter-spacing: 4px;
  opacity: 0;
  margin-top: 48px;
  animation: introEnterIn 0.8s ease forwards, introEnterblink 1.8s ease-in-out infinite;
  animation-delay: 3s, 3.8s;
}

@keyframes introEnterIn {
  from { opacity:0; transform:translateY(6px); }
  to   { opacity:1; transform:translateY(0); }
}

@keyframes introEnterblink {
  0%,100% { opacity: 1; }
  50%     { opacity: 0.2; }
}


/* ============================================================
   标题页（含开始/继续/存档按钮）
   ============================================================ */
#title-screen {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #050505 url('images/title_bg.jpg') center/cover no-repeat;
  z-index: 100;
}

#title-bg-overlay {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.72);
}

#title-content {
  position: relative;
  z-index: 1;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
  padding: 40px 24px;
}

/* 主标题 */
#title-logo {
  font-size: 65px;
  font-family: 'Ma Shan Zheng', 'STXingkai', 'KaiTi', serif;
  font-weight: 900;
  color: #c3a47f;
  letter-spacing: 14px;
  text-shadow:
  0 0 40px rgba(140,20,10,0.4),
  1px 2px 0px rgba(0,0,0,0.8);
  opacity: 0;
  margin-bottom: 20px;
  animation: titleFadeIn 2s ease forwards;
  animation-delay: 0.3s;
}
@keyframes titleFadeIn {
  0%   { opacity: 0; letter-spacing: 18px; }
  100% { opacity: 1; letter-spacing: 14px; }
}

/* 副标题 */
#title-sub {
  font-family: 'Ma Shan Zheng', 'STXingkai', serif;
  font-size: 15px;
  color: #856351;
  letter-spacing: 10px;
  opacity: 0;
  margin-bottom: 12px;
  animation: subFadeIn 1.2s ease forwards;
  animation-delay: 1.8s;  /* 比主标题晚 */
}

@keyframes subFadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* 引言小字 */
#title-quote {
  font-family: 'Ma Shan Zheng', 'STXingkai', serif;
  font-size: 12px;
  color: #444;
  font-style: italic;
  line-height: 2.2;
  opacity: 0;
  margin-bottom: 40px;
  animation: subFadeIn 1.2s ease forwards;
  animation-delay: 2.4s;
}

/* 按钮区 */
#title-btns {
  display: flex;
  flex-direction: column;
  gap: 14px;
  width: 240px;
  opacity: 0;  /* JS控制出现 */
}

/* 普通按钮（有边框） */
.title-btn {
  background: transparent;
  border: 1px solid var(--accent);
  color: var(--highlight);
  padding: 14px 0;
  font-size: 15px;
  font-family: inherit;
  letter-spacing: 3px;
  cursor: pointer;
  transition: all 0.2s ease;
}

.title-btn:hover {
  background: rgba(138,106,58,0.15);
  border-color: var(--highlight);
  box-shadow: 0 0 16px rgba(200,160,80,0.2);
}

/* 第一次进入：开始游戏按钮（无边框，闪烁） */
.title-btn-first {
  background: transparent;
  border: none;
  color: var(--highlight);
  padding: 14px 0;
  font-size: 16px;
  font-family: inherit;
  letter-spacing: 4px;
  cursor: pointer;
  animation: btnBlink 1.4s ease-in-out infinite;
}

@keyframes btnBlink {
  0%, 100% { opacity: 1; }
  50%       { opacity: 0.25; }
}

.title-btn-first:hover {
  animation: none;
  opacity: 1;
  text-shadow: 0 0 12px rgba(200,160,80,0.6);
}


/* ============================================================
   弹窗：存档读档
   ============================================================ */
#save-modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.8);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
}

#save-modal-inner {
  background: #111;
  border: 1px solid var(--accent);
  padding: 28px 32px;
  width: 360px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

#save-modal-title {
  color: var(--highlight);
  font-size: 14px;
  letter-spacing: 3px;
  text-align: center;
}

.save-slot {
  background: #0a0a0a;
  border: 1px solid var(--border);
  padding: 14px 16px;
  cursor: pointer;
  transition: border-color 0.15s;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.save-slot:hover { border-color: var(--accent); }

.save-slot-name {
  font-size: 13px;
  color: var(--text);
}

.save-slot-info {
  font-size: 11px;
  color: var(--dim);
  font-family: monospace;
}

.save-slot-empty {
  color: var(--dim);
  font-style: italic;
  font-size: 12px;
}

.save-modal-close {
  background: transparent;
  border: 1px solid #333;
  color: var(--dim);
  padding: 8px;
  cursor: pointer;
  font-family: inherit;
  font-size: 12px;
  letter-spacing: 2px;
  margin-top: 4px;
  transition: border-color 0.15s;
}
.save-modal-close:hover { border-color: var(--dim); }


/* ============================================================
   弹窗：返回首页确认
   ============================================================ */
#home-modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  z-index: 300;
  display: flex;
  align-items: center;
  justify-content: center;
}
#home-modal-inner {
  background: #111;
  border: 1px solid var(--accent);
  padding: 28px 32px;
  width: 320px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
#home-modal-title {
  color: var(--highlight);
  font-size: 14px;
  letter-spacing: 3px;
  text-align: center;
  margin-bottom: 4px;
}


/* 叙事框噪点纹理 - 动态颗粒感 */
#narrative-box::after {
  content: '';
  position: absolute;
  overflow: hidden; 
  inset: -10%;
  width: 120%;
  height: 120%;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.07'/%3E%3C/svg%3E");
  opacity: 0.1;
  pointer-events: none;
  animation: noiseShift 0.8s steps(1) infinite;
}

@keyframes noiseShift {
  0%   { transform: translate(0, 0); }
  25%  { transform: translate(-3%, -2%); }
  50%  { transform: translate(2%, 3%); }
  75%  { transform: translate(-1%, 2%); }
  100% { transform: translate(3%, -1%); }
}

</style>
</head>
<body>
<!-- 背景音乐 -->
<audio id="bgm" loop preload="auto" volume="0.4">
  <source src="the_start.mp3" type="audio/mpeg">
</audio>


<!-- 控制按钮（右下角） -->
<div id="game-controls">
  <button class="ctrl-btn" onclick="toggleBGM()" id="music-btn" title="音乐">🔊</button>
  <button class="ctrl-btn" onclick="openSaveModal('save')" title="存档">💾</button>
  <button class="ctrl-btn" onclick="openSaveModal('load')" title="读档">📂</button>
  <button class="ctrl-btn" onclick="confirmReturnHome()" title="返回首页">🏠</button>
</div>


 <!-- ========== 引导页（最先显示） ========== -->
<div id="intro-screen">
  <div id="intro-overlay"></div>
  <div id="intro-content">
    <div id="intro-logo">末日求生</div>
    <div id="intro-sub">· 寂静居民楼 ·</div>
    <div id="intro-enter">—— 点击任意处进入 ——</div>
  </div>
</div>


 <!-- ========== 标题页 ========== -->
<div id="title-screen" style="display:none;">
  <div id="title-bg-overlay"></div>
  <div id="title-content">
    <div id="title-logo">末日求生</div>
    <div id="title-sub">· 寂静居民楼 ·</div>
    <div id="title-quote">有人说，末日是另一个开始。<br>但我只是一个普通人……</div>
    <div id="title-btns"></div>
  </div>
</div>


<!-- ========== 存档选择弹窗 ========== -->
<div id="save-modal" style="display:none;">
  <div id="save-modal-inner">
    <div id="save-modal-title">— 选择存档槽 —</div>
    <div id="save-slots"></div>
    <button class="save-modal-close" onclick="closeSaveModal()">取消</button>
  </div>
   </div>


<!-- ========== 返回首页确认弹窗 ========== -->
<div id="home-modal" style="display:none;">
  <div id="home-modal-inner">
    <div id="home-modal-title">— 返回首页 —</div>
    <div style="font-size:13px;color:var(--dim);text-align:center;
                line-height:2;margin:8px 0 16px;">
      即将返回首页，是否先保存存档？
    </div>
    <div style="display:flex;flex-direction:column;gap:10px;">
      <button class="title-btn" onclick="saveBeforeHome()">保存存档后返回</button>
      <button class="title-btn" onclick="directReturnHome()" 
              style="border-color:#444;color:#666;">
        直接返回（不保存）
      </button>
      <button class="save-modal-close" onclick="closeHomeModal()">取消</button>
    </div>
  </div>
</div>


<!-- ========== APP-游戏主体 ========== -->
<div id="app" style="display:none;">
  <div id="status-bar">
    <span id="chapter-label">第一章·居民楼</span>
    <div id="stats">
      <span class="stat"><span class="stat-icon">💧</span><span class="stat-val" id="stat-water">未知</span></span>
      <span class="stat"><span class="stat-icon">🍱</span><span class="stat-val" id="stat-food">未知</span></span>
      <span class="stat"><span class="stat-icon">👥</span><span class="stat-val" id="stat-people">独自</span></span>
    </div>
  </div>

  <div id="narrative-box">
    <div id="narrative-content" class="fade-in"></div>
    <div id="loading">…</div>
  </div>

  <div id="choices-box">
    <div id="choices-label">— 你的选择 —</div>
    <div id="choices-content"></div>
    <div id="restart-area">
      <span id="restart-msg" style="color:var(--dim);font-size:13px;"></span>
      <button class="restart-btn" onclick="restartGame()">▶ 重新开始</button>
    </div>
  </div>

  <div id="footer-bar">
    <span id="node-id" style="opacity:0.4"></span>
    <span>末日求生·寂静居民楼</span>
  </div>
</div>
<script>


// ============================================================
// 【数据层】游戏节点
// 字段说明：
//   chapter    - 章节名，显示在顶部状态栏
//   bg         - 背景图路径
//   bgm        - 章节音乐路径（只在章节首节点设置）
//   sfx        - 一次性音效 { src, duration }
//   sfxDelay   - 延迟音效 
//   autoSavePoint - true = 进入此节点自动存档
//   stateChange   - 状态变化 { water/food/people/peopleSet直接设置人数/peopleAdd记名字/peopleRemove删名字 }
//   text       - 叙事HTML内容
//   choices    - 选项数组 [ { key, text, next, tag } ]

// ============================================================
// 【状态层】全局游戏状态
// 不直接写在节点里，通过节点的 stateChange 字段驱动更新
// ============================================================
const gameState = {
  water: "未知",
  food: "未知",
  people: 1,        // 用数字，方便自动增减
  peopleNames: [],  // 存NPC名字列表，方便调试
   intel: 0,        // 情报值，隐性积累
};

// 把people数字转成显示文字
function getPeopleDisplay() {
  if (gameState.people <= 1) return "独自";
  return gameState.people + "人";
}

// 更新顶部状态栏显示
function updateStatusBar(chapter) {
  if (chapter) document.getElementById('chapter-label').textContent = chapter;
  document.getElementById('stat-water').textContent = gameState.water;
  document.getElementById('stat-food').textContent = gameState.food;
  document.getElementById('stat-people').textContent = getPeopleDisplay();
}


// ============================================================
// 【引擎层】游戏运行时变量
// ============================================================
let currentNode = "start";
let visitedNodes = new Set();
// getNode(): 解析节点，处理 redirect 跳转和 prependText 合并
function getNode(id) {
  let node = NODES[id];
  if (!node) return null;
  if (node.redirect) {
    const pretext = node.pretext || "";
    const target = NODES[node.redirect];
    if (!target) return null;
    return { ...target, prependText: pretext };
  }
  return node;
}


// ============================================================
// 【渲染层】打字机引擎
// 逐字打出每段文字，每段结束停下等玩家点击
// narrative-box 整体监听点击事件（narrative-content 设为 pointer-events:none）
// =============================================================
let typingTimer = null; // 用于中断打字
//普通剧情文本速度
 function typewriterHTML(el, html, onDone, speed = 90) {
  if (typingTimer) clearTimeout(typingTimer);
  document.removeEventListener('click', window._narrativeClickHandler);
  el.innerHTML = '';

  const temp = document.createElement('div');
  temp.innerHTML = html;
  const paragraphs = Array.from(temp.childNodes);

  let pIndex = 0;
  let cIndex = 0;
  let currentP = null;
  let fullText = '';
  let waitingForNext = false;

  window._narrativeClickHandler = function(e) {
    // 点到按钮或弹窗时不触发
    if (e.target.closest('button') ||
        e.target.closest('#game-controls') ||
        e.target.closest('#save-modal') ||
        e.target.closest('#home-modal')) return;

    if (waitingForNext) {
      waitingForNext = false;
      hideContinueHint();
      pIndex++;
      if (pIndex >= paragraphs.length) {
        document.removeEventListener('click', window._narrativeClickHandler);
        if (onDone) onDone();
        return;
      }
      startParagraph();
    } else {
      if (typingTimer) clearTimeout(typingTimer);
      if (currentP && fullText) currentP.innerHTML = fullText;
      cIndex = fullText.length;
      waitingForNext = true;
      showContinueHint();
    }
  };
  document.addEventListener('click', window._narrativeClickHandler);


   function showContinueHint() {
     if (document.getElementById('continue-hint')) return;
     const hint = document.createElement('span');
     hint.id = 'continue-hint';
     hint.style.cssText = `
      color: var(--accent);
      font-size: 12px;
      font-family: monospace;
      opacity: 0;
      margin-left: 8px;
      animation: hintPulse 2s ease-in-out infinite;
      `;
   hint.textContent = '▶';
    if (currentP) {
    currentP.appendChild(hint);
    } else {
    el.appendChild(hint);
    }
   setTimeout(() => { hint.style.opacity = ''; }, 300);
   }


   function hideContinueHint() {
    const hint = document.getElementById('continue-hint');
    if (hint) hint.remove();
   }


   function typeNextChar() {
    if (cIndex >= fullText.length) {
      // 当前段打完，等待点击
      waitingForNext = true;
      showContinueHint();
      return; // 不设任何定时器，纯等玩家点击
    }
    currentP.innerHTML = fullText.slice(0, cIndex + 1);
    cIndex++;

    // 跳过HTML标签
    if (fullText[cIndex] === '<') {
      const closeIdx = fullText.indexOf('>', cIndex);
      if (closeIdx !== -1) cIndex = closeIdx + 1;
    }

    typingTimer = setTimeout(typeNextChar, speed);
    }

   function startParagraph() {
      hideContinueHint();
      if (pIndex >= paragraphs.length) {
      document.removeEventListener('click', window._narrativeClickHandler);
      if (onDone) onDone();
      return;
     }

      const srcNode = paragraphs[pIndex];

      if (srcNode.nodeType === 3 && srcNode.textContent.trim() === '')
     {
      pIndex++;
      startParagraph();
      return;
     }

      if (srcNode.nodeType === 3) {
      currentP = document.createElement('span');
      } else {
      currentP = document.createElement(srcNode.tagName || 'p');
      if (srcNode.className) currentP.className = srcNode.className;
      if (srcNode.getAttribute && srcNode.getAttribute('style')) {
        currentP.setAttribute('style', srcNode.getAttribute('style'));
        }
      }
      el.appendChild(currentP);
      cIndex = 0;

      fullText = srcNode.nodeType === 3 ? srcNode.textContent : srcNode.innerHTML;
   
      if (pIndex === 0) {
      const nc = document.getElementById('narrative-content');
      nc.style.transition = 'opacity 0.4s ease';
      nc.style.opacity = '1';
      }   
      typingTimer = setTimeout(typeNextChar, 200);
   }
   startParagraph();
}


// ============================================================
// 【音频层】背景音乐 + 一次性音效
// bgmUnlocked: 浏览器要求用户交互后才能播放，引导页点击时解锁
// switchBGM(): 淡出当前音乐再淡入新音乐
// playSFX(): 播放音效，duration毫秒前1秒开始淡出
// ============================================================
const bgm = document.getElementById('bgm');
let bgmMuted = false;
let bgmUnlocked = false;
function unlockAndPlay(src) {
  if (src) bgm.src = src;
  bgmUnlocked = true;
  bgm.volume = 0.35;
  bgm.play().catch(() => {});
}


// 标题页绑定解锁（点击标题页任意处触发）
function bindTitleAudioUnlock() {
  const ts = document.getElementById('title-screen');
  const unlock = () => {
    if (!bgmUnlocked) unlockAndPlay();
    ts.removeEventListener('click', unlock);
  };
  ts.addEventListener('click', unlock);
}


function toggleBGM() {
  bgmMuted = !bgmMuted;
  bgm.muted = bgmMuted;
  document.getElementById('music-btn').textContent = bgmMuted ? '🔇' : '🔊';
}


// 播放一次性音效
function playSFX(src, duration) {
if (!src) return;
if (!bgmUnlocked) {
  // 还没解锁时，延迟等解锁后再播
  const waitPlay = setInterval(() => {
    if (bgmUnlocked) {
      clearInterval(waitPlay);
      playSFX(src, duration);
    }
  }, 200);
  return;
}
  // 停掉上一个sfx
  if (window._sfxAudio) {
    fadeSFXOut(window._sfxAudio);
    window._sfxAudio = null;
  }

  const sfx = new Audio(src);
  sfx.volume = 0.5;
  window._sfxAudio = sfx;
  sfx.play().catch(() => {});

  if (duration) {
    // 在duration结束前1秒开始淡出
   const fadeStartDelay = Math.max(duration - 1000, 0);
   setTimeout(() => {
    if (window._sfxAudio === sfx) {
    fadeSFXOut(sfx);
    window._sfxAudio = null;
    }
   }, fadeStartDelay);
  }
}

// sfx淡出函数
  function fadeSFXOut(sfxAudio, duration = 1000) {
    if (!sfxAudio) return;
    const step = sfxAudio.volume / (duration / 50);
    const fade = setInterval(() => {
    if (sfxAudio.volume > step) {
      sfxAudio.volume = Math.max(sfxAudio.volume - step, 0);
    } else {
      sfxAudio.pause();
      sfxAudio.currentTime = 0;
      clearInterval(fade);
      }
    }, 50);
}

   function switchBGM(src) {
    if (!src) return;

   // 检查是否已经在播这个文件
   const currentSrc = bgm.src ? bgm.src.split('/').pop() : '';
   const newSrc = src.split('/').pop();
   if (currentSrc === newSrc && !bgm.paused) return;

   if (!bgmUnlocked) {
    // 还没解锁，先设好src等解锁后自动播
    bgm.src = src;
    return;
   }

   // 有音量才做淡出，否则直接切
   if (bgm.volume > 0.01 && !bgm.paused) {
    let vol = bgm.volume;
    const fadeOut = setInterval(() => {
      if (vol > 0.03) {
        vol -= 0.04;
        bgm.volume = Math.max(vol, 0);
       } else {
        clearInterval(fadeOut);
        bgm.src = src;
        bgm.volume = 0;
        bgm.play().catch(() => {});
        let v = 0;
        const fadeIn = setInterval(() => {
          if (v < 0.35) { v += 0.03; bgm.volume = v; }
          else clearInterval(fadeIn);
         }, 60);
       }
     }, 50);
   } else {
    bgm.src = src;
    bgm.volume = 0.35;
    bgm.play().catch(() => {});
   }
}

// key格式：doomsday_slot + 槽名
// ============================================================

 const SAVE_PREFIX = 'doomsday_';
 let saveModalMode = 'load'; // 'load' 或 'save'

 function getSaveData(slot) {
  const raw = localStorage.getItem(SAVE_PREFIX + 'slot' + slot);
  return raw ? JSON.parse(raw) : null;
}

 function writeSaveData(slot, data) {
  localStorage.setItem(SAVE_PREFIX + 'slot' + slot, JSON.stringify(data));
}

 function deleteSaveData(slot) {
  localStorage.removeItem(SAVE_PREFIX + 'slot' + slot);
}

 function hasAnySave() {
  return [1,2,3].some(i => getSaveData(i) !== null);
}

 // 自动存档：在有 autoSavePoint:true 的节点延迟0.5s触发
 function autoSave(nodeId, chapterName) {
 writeSaveData('auto', {

  chapter: chapterName || '',
  savedAt: new Date().toLocaleString('zh-CN', {month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'}),

  state: {

 writeSaveData(slot, {

// 读档：从指定槽恢复节点，重置gameState，切换章节音乐
 function loadFromSlot(slot) {
  const data = getSaveData(slot);
  if (!data) return;
  closeSaveModal();

  const ts = document.getElementById('title-screen');
  if (ts && ts.style.display !== 'none') {
    hideTitleScreen();
  }

  if (data.state) {
  gameState.water = data.state.water || "未知";
  gameState.food  = data.state.food  || "未知";
  gameState.people = data.state.people || 1;
  gameState.peopleNames = data.state.peopleNames || [];
} else {
  gameState.water = "未知";
  gameState.food  = "未知";
  gameState.people = 1;
  gameState.peopleNames = [];
}
  renderNode(data.nodeId, true);

  // 读档后立即切换章节音乐
  setTimeout(() => {
    const chapterBGM = getChapterBGM(data.nodeId);
    if (chapterBGM) switchBGM(chapterBGM);
  }, 100);
}

 // 根据节点找该章节的背景音乐
 function getChapterBGM(nodeId) {
  const targetNode = getNode(nodeId);
  if (!targetNode) return null;
  if (targetNode.bgm) return targetNode.bgm;

  const targetChapter = targetNode.chapter;
  const keys = Object.keys(NODES);
  for (let i = 0; i < keys.length; i++) {
    const n = NODES[keys[i]];
    if (n && n.chapter === targetChapter && n.bgm) return n.bgm;
  }
  return null;
}

 // 存档弹窗：mode='save' 保存模式 / mode='load' 读取模式
 // 自动存档位只读，手动存档位可覆盖

        </div>
        ${mode==='load' ? '<div class="save-slot-info">读取</div>' : 
          '<div class="save-slot-info" style="color:#333">只读</div>'}
      </div>
      <div style="height:12px;border-bottom:1px solid #222;margin-bottom:12px;"></div>
      <div style="font-size:10px;color:var(--dim);letter-spacing:2px;
                  margin-bottom:4px;font-family:monospace;">手动存档</div>
    `;
  }

  // 三个手动存档位
  html += [1,2,3].map(i => {
    const data = getSaveData(i);
    if (data) {
      return `<div class="save-slot" onclick="${mode==='save' ? `saveToSlot(${i})` : `loadFromSlot(${i})`}">
        <div>
          <div class="save-slot-name">存档 ${i}
            　<span style="color:var(--accent);font-size:11px">${data.chapter}</span>
          </div>
          <div class="save-slot-info">${data.savedAt}</div>

        ${mode==='save' ? '<div class="save-slot-info" style="color:#553">[覆盖]</div>' : 
          '<div class="save-slot-info">读取</div>'}
      </div>`;
    } else {
      return `<div class="save-slot" onclick="${mode==='save' ? `saveToSlot(${i})` : ''}">

        ${mode==='save' ? '' : '<span class="save-slot-info" style="color:#333">空</span>'}

  }).join('');

  slotsDiv.innerHTML = html;
  modal.style.display = 'flex';
}

//开始新游戏存档
function newGame() {
  if (hasAnySave() || getSaveData('auto')) {
    if (!confirm('开始新游戏将覆盖自动存档，手动存档不受影响，确认？')) return;
  }
  deleteSaveData('auto');
  hideTitleScreen();
  visitedNodes.clear();
  gameState.water = "未知";
  gameState.food  = "未知";
  gameState.people = 1;
  gameState.peopleNames = [];
  renderNode("start");
}


// 继续游戏：读取最近的一个存档（槽1优先）
function continueGame() {
  const autoData = getSaveData('auto');
  if (autoData) {
    hideTitleScreen();
    if (autoData.state) {
      gameState.water = autoData.state.water || "未知";
      gameState.food  = autoData.state.food  || "未知";
      gameState.people = autoData.state.people || 1;
      gameState.peopleNames = autoData.state.peopleNames || [];
    } else {
      gameState.water = "未知";
      gameState.food  = "未知";
      gameState.people = 1;
      gameState.peopleNames = [];
    }
  renderNode(autoData.nodeId, true);
    setTimeout(() => { const b = getChapterBGM(autoData.nodeId); if(b) switchBGM(b); }, 100);
    return;
  }
  for (let i = 1; i <= 3; i++) {
    const data = getSaveData(i);
    if (data) {
      hideTitleScreen();
      if (data.state) {
        gameState.water = data.state.water || "未知";
        gameState.food  = data.state.food  || "未知";
        gameState.people = data.state.people || 1;
        gameState.peopleNames = data.state.peopleNames || [];
      } else {
        gameState.water = "未知";
        gameState.food  = "未知";
        gameState.people = 1;
        gameState.peopleNames = [];
      }
    renderNode(data.nodeId, true);
      setTimeout(() => { const b = getChapterBGM(data.nodeId); if(b) switchBGM(b); }, 100);
      return;
    }
  }
}

// ============================================================
// 【核心渲染】切换到指定节点
// 执行顺序：状态更新 → 存档触发 → 背景/音乐切换 → 叙事区淡出清空
//          → 打字机开始（第一段时叙事区淡入）→ 打字结束后选项框淡入
// ============================================================
function renderNode(nodeId, skipStateChange = false) {
  // 清掉上一节点的sfx延迟计时器
  if (window._sfxDelayTimer) {
  clearTimeout(window._sfxDelayTimer);
  window._sfxDelayTimer = null;
}
  const node = getNode(nodeId);
  if (!node) return;

  currentNode = nodeId;
  visitedNodes.add(nodeId);
  // 处理状态变化
if (node.stateChange && !skipStateChange) {
  const sc = node.stateChange;
  
  if (sc.water !== undefined) gameState.water = sc.water;
  if (sc.food !== undefined)  gameState.food  = sc.food;
  
  if (sc.people !== undefined) {
    gameState.people = Math.max(1, gameState.people + sc.people);
  }
  if (sc.peopleAdd) {
    gameState.peopleNames.push(sc.peopleAdd);
  }
  if (sc.peopleRemove) {
    const idx = gameState.peopleNames.indexOf(sc.peopleRemove);
    if (idx > -1) gameState.peopleNames.splice(idx, 1);
  }
  // 直接设置人数（不用加减，直接指定）
  if (sc.peopleSet !== undefined) {
    gameState.people = sc.peopleSet;
  }

  if (sc.intel !== undefined) {
  gameState.intel = Math.max(0, gameState.intel + sc.intel);
}
}
// 更新显示
updateStatusBar(node.chapter);
// 自动存档触发
if (node.autoSavePoint) {
  setTimeout(() => autoSave(nodeId, node.chapter), 500);
}
  document.getElementById('node-id').textContent = nodeId;
  // 切换背景图，背景音乐（如果节点有bg字段）
 if (node.bg) {
  document.body.style.backgroundImage = `url('${node.bg}')`;
}
if (node.bgm) {
  switchBGM(node.bgm);
}
//触发音效
if (node.sfx) {
  if (node.sfxDelay) {
    // 有延迟则等待后再播
    window._sfxDelayTimer = setTimeout(() => {
      playSFX(node.sfx.src, node.sfx.duration);
    }, node.sfxDelay);
  } else {
    // 没有延迟直接播
    playSFX(node.sfx.src, node.sfx.duration);
  }
}
  // 叙事区
  const narrativeBox = document.getElementById('narrative-box');
  const narrativeContent = document.getElementById('narrative-content');
  narrativeContent.style.transition = 'none';
  narrativeContent.style.opacity = '0';
  narrativeContent.innerHTML = '';
  
  let html = "";
  if (node.prependText) html += node.prependText;
  html += node.text || "";

  // 结局处理
  if (node.isEnding) {
    // 先隐藏选项框和footer
    document.getElementById('choices-box').style.opacity = '0';
    document.getElementById('footer-bar').style.display = 'none';
    narrativeBox.className = node.endingType === 'good' ? 'ending-good' : 'ending-bad';
    const titleColor = node.endingType === 'good' ? '#8fbc8f' : '#bc8f8f';
    html += `
      <div class="ending-title" style="color:${titleColor}">—— ${node.endingName} ——</div>
      <div class="ending-subtitle">${node.endingQuote || ""}</div>
    `;
    // 打字结束后显示结局按钮
    typewriterHTML(narrativeContent, html, () => {
        const choicesBox = document.getElementById('choices-box');
        choicesBox.style.opacity = '1';        // ← 加这行，让它显示
        choicesBox.style.transform = 'none';   // ← 加这行
      document.getElementById('choices-content').innerHTML = "";
      document.getElementById('choices-label').textContent = "— 游戏结束 —";
      const restartArea = document.getElementById('restart-area');
      restartArea.style.display = 'flex';
      document.getElementById('restart-msg').textContent =
        node.endingType === 'good' ? "恭喜通关！还想再走一遍吗？" : "感谢游玩！是否重新开始？";
    }, 55);
  } else {
    narrativeBox.className = "";
    document.getElementById('restart-area').style.display = 'none';
    // 先隐藏选项框，打字完毕后再显示
    document.getElementById('footer-bar').style.display = 'none';
    const choicesBox = document.getElementById('choices-box');
    choicesBox.style.opacity = '0';
    //结局文本速度
    typewriterHTML(narrativeContent, html, () => {
      showChoicesAnimated(node);
    }, 70);
  }
  // 滚动到顶部
  narrativeBox.scrollTop = 0;
  window.scrollTo(0, 0);
}


// 处理选项点击，如果目标节点是概率节点则先结算再跳转
function choose(nextNodeId) {
  if (!nextNodeId) return;
  // 处理概率节点
  const node = NODES[nextNodeId];
  if (node && node.isRoll) {
    const roll = Math.random();
    const target = roll < node.successRate ? node.successNext : node.failNext;
    renderNode(target);
    return;
  }
  renderNode(nextNodeId);
}


// 处理选项点击，如果目标节点是概率节点则先结算再跳转
function restartGame() {
  visitedNodes.clear();
  // 重置状态
  gameState.water = "未知";
  gameState.food  = "未知";
  gameState.people = 1;
  gameState.peopleNames = [];
  document.getElementById('narrative-box').className = '';
  renderNode("start");
}

// 启动：显示引导页
initIntroScreen();

</script>
